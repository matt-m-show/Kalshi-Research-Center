[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "keyring>=25.0",
    "cryptography>=43.0",
    "apscheduler>=3.10",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "rich>=13.0",
    "plyer>=2.1",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
