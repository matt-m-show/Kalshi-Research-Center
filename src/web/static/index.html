<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kalshi Research Center</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">Kalshi <span class="hide-sm">Research Center</span></span>
    <span id="posture" class="posture demo"><span class="dot"></span><span>…</span></span>
    <span class="grow"></span>
    <span id="conn" class="conn"><i></i><span class="hide-sm">Kalshi</span></span>
    <div class="menu">
      <button class="icon-btn" data-action="menu" aria-haspopup="true" aria-expanded="false" aria-label="Actions">☰</button>
      <div id="menu-list" class="menu-list hidden" role="menu"></div>
    </div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <button data-action="tab" data-tab="overview">Overview</button>
    <button data-action="tab" data-tab="approvals">Approvals<span id="pending-badge" class="badge hidden">0</span></button>
    <button data-action="tab" data-tab="positions">Positions</button>
    <button data-action="tab" data-tab="runs">Runs</button>
    <button data-action="tab" data-tab="settings">Settings</button>
  </nav>

  <main id="view" aria-live="polite"></main>
  <div id="toast" role="status"></div>
</body>
</html>
