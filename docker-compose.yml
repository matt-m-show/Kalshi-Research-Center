services:
  kalshi-agents:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist runtime data outside the container
      - ./data:/app/data
      - ./logs:/app/logs
      - ./metrics:/app/metrics
      - ./reports:/app/reports
      # Config is editable on the host; changes take effect on next research cycle
      - ./config:/app/config
      # Optional: mount ~/.kalshi PEM directory instead of using KALSHI_PEM_B64
      # - ~/.kalshi:/home/kalshi/.kalshi:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
