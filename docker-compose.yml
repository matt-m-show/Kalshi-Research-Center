services:
  kalshi-agents:
    build: .
    ports:
      # Localhost only. For phone access use `tailscale serve` on the host (see README)
      # rather than exposing the port to your network.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Ollama running on the host machine (see README → Local model)
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist runtime data outside the container
      - ./data:/app/data
      - ./logs:/app/logs
      - ./metrics:/app/metrics
      - ./reports:/app/reports
      # Config is editable on the host; changes take effect on next research cycle
      - ./config:/app/config
      # Optional: mount ~/.kalshi PEM directory instead of using KALSHI_PEM_B64
      # - ~/.kalshi:/home/kalshi/.kalshi:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
